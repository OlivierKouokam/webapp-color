# Deployment 1 : Bleu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-color
      color: blue
  template:
    metadata:
      labels:
        app: webapp-color
        color: blue
    spec:
      containers:
      - name: webapp
        image: kodekloud/webapp-color
        env:
        - name: APP_COLOR
          value: "blue"
---
