# Deployment 3 : Rose
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-pink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp-color
      color: pink
  template:
    metadata:
      labels:
        app: webapp-color
        color: pink
    spec:
