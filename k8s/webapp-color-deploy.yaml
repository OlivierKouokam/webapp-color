---
# Service LoadBalancer unique ciblant le label commun "app: webapp-color"
apiVersion: v1
kind: Service
metadata:
  name: webapp-color-lb
spec:
  type: LoadBalancer
  selector:
    app: webapp-color
  ports:
  - port: 80
    targetPort: 8080
