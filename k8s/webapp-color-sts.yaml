apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: webapp-sts
spec:
  serviceName: "webapp-color"
  replicas: 3
  selector:
    matchLabels:
      app: webapp-color-sts
  template:
    metadata:
      labels:
        app: webapp-color-sts
    spec:
      containers:
      - name: webapp
        image: kodekloud/webapp-color
        command: ["/bin/sh", "-c"]
        args:
          - |
            case $HOSTNAME in
              *-0) export APP_COLOR=blue ;;
              *-1) export APP_COLOR=green ;;
              *-2) export APP_COLOR=pink ;;
            esac
            python app.py
# Service NodePort unique ciblant le label commun "app: webapp-color"
apiVersion: v1
kind: Service
metadata:
  name: webapp-color-np
spec:
  type: NodePort
  selector:
    app: webapp-color-sts
  ports:
  - port: 80
    targetPort: 8080
